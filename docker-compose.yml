# Samba 4 AD DC — deploy standalone
# Acesso exclusivo via malha NetBird (nenhuma porta publicada no host).
# Defina os valores no shell antes de subir (export SAMBA_ADMIN_PASSWORD=...)
# — os placeholders abaixo sao apenas fallbacks. Nunca commite valores reais.
#
# Gerenciador web (swat4) embutido — sobe junto com o DC:
#   docker compose --profile swat4 up -d
# (portas 8000/3000 publicadas somente em 127.0.0.1)

services:
  samba-dc:
    image: ghcr.io/fernandobayit/samba-ad-fs:latest
    pull_policy: always
    # Para desenvolvimento local, troque a linha acima por:
    # build: .
    # image: samba-ad-fs:latest
    container_name: samba-ad-dc1
    hostname: dc1
    domainname: swat.local
    privileged: true
    devices:
      - /dev/net/tun
    environment:
      SAMBA_REALM: ${SAMBA_REALM:-SWAT.LOCAL}
      SAMBA_DOMAIN: ${SAMBA_DOMAIN:-SWAT}
      SAMBA_ADMIN_PASSWORD: ${SAMBA_ADMIN_PASSWORD:-ChangeThisPassword}
      SAMBA_DNS_FORWARDER: ${SAMBA_DNS_FORWARDER:-1.1.1.1}
      NETBIRD_MANAGEMENT_URL: ${NETBIRD_MANAGEMENT_URL:-https://netbird.example.com:33073}
      NETBIRD_SETUP_KEY: ${NETBIRD_SETUP_KEY:-}
      # NETBIRD_PEER_IP: ${NETBIRD_PEER_IP:-}   # informativa apenas
    volumes:
      - samba-dados:/var/lib/samba
      - samba-config:/etc/samba
      - samba-logs:/var/log/samba
      - netbird-config:/etc/netbird
      - netbird-estado:/var/lib/netbird
      - samba-shares:/mnt/data
    restart: unless-stopped
    networks:
      - default
      - swat-net
    healthcheck:
      test: [ "CMD", "samba-tool", "processes", "--configfile=/etc/samba/smb.conf" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  swat4-backend:
    image: ghcr.io/fernandobayit/swat4-backend:latest
    pull_policy: always
    container_name: swat4-backend
    profiles: ["swat4"]
    environment:
      SAMBA_DC_HOST: samba-ad-dc1
      SAMBA_REALM: ${SAMBA_REALM:-SWAT.LOCAL}
      SAMBA_DOMAIN: ${SAMBA_DOMAIN:-SWAT}
      SAMBA_BASE_DN: ${SAMBA_BASE_DN:-DC=swat,DC=local}
      LDAP_URL: ${LDAP_URL:-ldap://samba-ad-dc1:389}
      SAMBA_ADMIN_USER: ${SAMBA_ADMIN_USER:-administrator}
      SAMBA_ADMIN_PASSWORD: ${SAMBA_ADMIN_PASSWORD:-ChangeThisPassword}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      ALLOWED_LOGIN_GROUPS: ${ALLOWED_LOGIN_GROUPS:-Domain Admins,Account Operators}
      SAMBA_LOG_PATH: /var/log/samba
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - samba-config:/etc/samba
      - samba-logs:/var/log/samba:ro
      - samba-shares:/mnt/data
      - swat4-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      samba-dc:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default:
        aliases:
          - swat4-backend
          - backend

  swat4-frontend:
    image: ghcr.io/fernandobayit/swat4-frontend:latest
    pull_policy: always
    container_name: swat4-frontend
    profiles: ["swat4"]
    environment:
      - NEXT_PUBLIC_API_URL=${SWAT4_API_URL:-http://localhost:8000}
      - API_URL=http://swat4-backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - swat4-backend
    restart: unless-stopped

volumes:
  samba-dados:
  samba-config:
  samba-logs:
  netbird-config:
  netbird-estado:
  samba-shares:
  swat4-data:

networks:
  swat-net:
    name: swat-net
    driver: bridge